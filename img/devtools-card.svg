<text class="t" x="80" y="218" fill="var(--mute)">+</text>
<rect x="90" y="203" width="52" height="22" rx="5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><text class="t" x="116" y="218" text-anchor="middle">Shift</text>
<text class="t" x="150" y="218" fill="var(--mute)">+</text>
