<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="DevTools Command Menu card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--panel:#ffffff;--ink:#16324f;--mute:#5b7089;--acc:#d9822b;--accbg:#fdf0e0}
@media (prefers-color-scheme:dark){:root{--panel:#112841;--ink:#d6e6f7;--mute:#8fa8c3;--acc:#f0a85a;--accbg:#3a2a18}}
.l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;fill:var(--ink)}
.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@keyframes blink{50%{opacity:0}}
.c{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.c{animation:none}}
</style>
